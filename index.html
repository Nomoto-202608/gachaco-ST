<title>最寄りのGachacoステーションを探します</title>
<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1f2419; --muted:#5f6657;
  --line:#e2e5dc; --accent:#2f3d0c; --warn:#9a3412;
  --brand:#c3d72c;       /* R195 G215 B44:ポイント使い */
  --brand-ink:#1f2a05;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);border-top:6px solid var(--brand);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  line-height:1.6}
main{height:calc(100% - 6px);display:grid;grid-template-columns:minmax(340px,460px) 1fr;gap:20px;padding:20px}
.side{display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding:4px 4px 4px 0}
h1.title{margin:6px 0 14px;font-size:clamp(1.12rem,5vw,1.58rem);font-weight:800;line-height:1.25;letter-spacing:.01em;white-space:nowrap;padding-bottom:10px;border-bottom:4px solid var(--brand)}
.title-main{display:inline-flex;align-items:center;gap:.3em}
.title-icon{width:.95em;height:.95em;flex:0 0 auto}
.title-sub{display:block;font-size:.55em;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
.lead{color:var(--muted);margin:0;font-size:.95rem}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.illust{flex:0 0 auto;width:104px;height:auto}
@media (max-width:400px){.illust{width:84px}}
.search{display:flex;flex-direction:column;gap:8px}
.search input{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border:2px solid var(--line);
  border-radius:10px;background:var(--panel);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(195,215,44,.35)}
.buttons{display:flex;gap:8px}
.buttons button{flex:1}
button{font:inherit;font-size:1rem;font-weight:600;padding:11px 16px;border-radius:10px;cursor:pointer;border:2px solid var(--accent)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.primary:hover{filter:brightness(.95)}
.secondary{background:var(--panel);border-color:var(--line);color:var(--ink)}
button:disabled{opacity:.5;cursor:wait}
.status{min-height:1.6em;margin:12px 0 4px;font-size:.9rem;color:var(--muted)}
.status.error{color:var(--warn);font-weight:600}
ol.results{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px}
ol.results li{display:grid;grid-template-columns:40px 1fr;gap:2px 12px;align-items:start;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rank{grid-row:1 / span 3;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:1.1rem;font-weight:700;display:grid;place-items:center}
.name{font-weight:700;font-size:1.02rem}
.addr{color:var(--muted);font-size:.86rem}
.dist b{font-size:1.2rem}
.dist a{margin-left:12px;font-size:.88rem;color:var(--accent);font-weight:600}
.origin{font-size:.85rem;color:var(--muted);margin-top:12px}
.note{font-size:.78rem;color:var(--muted);margin-top:auto;padding-top:18px}
.mapwrap{border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);min-height:0}
.mapwrap #map{width:100%;height:100%;background:#f7f8f5}
/* 地図の淡さ:opacity を小さくするほど淡く、大きくするほど濃くなります(0〜1) */
.leaflet-tile-pane{opacity:.7;filter:grayscale(35%) contrast(.9) brightness(1.04)}
.leaflet-container{font:inherit}
.st-logo{width:28px;height:28px;border-radius:50%;background:#fff;border:1.5px solid #c9cec2;box-shadow:0 1px 4px rgba(0,0,0,.3);display:grid;place-items:center}
.st-logo img{width:18px;height:18px;display:block}
.st-rank{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);border:2px solid #fff;
  font-weight:800;font-size:15px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.origin-pin{width:30px;height:42px}
.popup-name{font-weight:700;margin-bottom:2px}
.popup-addr{color:#5f6657;font-size:.85em}
.leaflet-container .popup a{color:#2f3d0c;font-weight:600}
li.clickable{cursor:pointer}
li.clickable:hover{border-color:var(--brand)}
@media (max-width:820px){
  html,body{height:auto}
  main{height:auto;grid-template-columns:1fr;padding:16px}
  .side{overflow:visible;padding:0}
  .mapwrap #map{height:420px}
}
</style>

function initMap(){
  if (typeof L === "undefined"){ $("map").textContent = "地図を読み込めませんでした。"; return; }

}

    <a href="${route}" target="_blank" rel="noopener">経路を見る</a></div>`;
}

  if (!map) return;

const statusEl = $("status");
const CACHE_KEY = "gachaco-geo-v1";
let cache = {};
try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); } catch (e) { cache = {}; }
function saveCache(){ try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) {} }
let stations = [];

function setStatus(text, isError){
  statusEl.textContent = text;
  statusEl.classList.toggle("error", !!isError);
}

// 住所の表記ゆれを整える(全角数字・ハイフン、括弧書き、空白)
function normalize(addr){
  return addr
    .replace(/[((][^))]*[))]/g, "")
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[−ー―‐-–—]/g, (m, i, s) => /\d/.test(s[i-1] || "") ? "-" : m)
    .replace(/\s+/g, "")
    .trim();
}

async function geocode(addr){
  const url = "https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(normalize(addr));
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (!data.length) return null;
  const [lng, lat] = data[0].geometry.coordinates;
  return { lat, lng, label: data[0].properties.title };
}

async function fetchLatest(){
  if (!API_URL) return null;
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (data && Array.isArray(data.stations) && data.stations.length) return data.stations;
    if (data && data.error) console.warn("Apps Script エラー:", data.error);
  } catch (e) { console.warn("最新の一覧を取得できませんでした:", e); }
  return null;
}

async function loadStations(){
  setStatus("ステーション一覧を読み込んでいます…");
  const latest = await fetchLatest();
  const usingFallback = !latest;
  stations = (latest || FALLBACK).map(s => ({ ...s }));

  // 位置が入っていないステーションは国土地理院の住所検索で補う
  stations.forEach(s => { if (s.lat == null && cache[s.a]) { s.lat = cache[s.a].lat; s.lng = cache[s.a].lng; } });
  const todo = stations.filter(s => s.lat == null && s.a);
  const total = todo.length;
  let done = 0;
  const worker = async () => {
    while (todo.length){
      const s = todo.shift();
      try {
        const g = await geocode(s.a);
        if (g){ s.lat = g.lat; s.lng = g.lng; cache[s.a] = { lat: g.lat, lng: g.lng }; }
      } catch (e) {}
      done++;
      setStatus(`ステーションの位置を読み込んでいます… ${done} / ${total}`);
    }
  };
  if (total) { await Promise.all([worker(), worker(), worker(), worker()]); saveCache(); }

  const ready = stations.filter(s => s.lat != null);
  const missing = stations.length - ready.length;
  if (!ready.length){
    setStatus("ステーションの位置を読み込めませんでした。インターネットに接続されているか確認し、ページを再読み込みしてください。", true);
    return;
  }
  $("go").disabled = false; $("here").disabled = false;
  let msg = `${ready.length}か所のステーションから検索できます。`;
  if (missing) msg += `(位置が特定できなかった${missing}か所は除外)`;
  if (usingFallback && API_URL) msg = "最新の一覧を取得できなかったため、保存済みの一覧で検索します。" + msg;
  setStatus(msg, usingFallback && !!API_URL);
  drawStations();
}

function distanceKm(a, b){
  const r = d => d * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 6371 * 2 * Math.asin(Math.sqrt(h));
}

function formatKm(km){ return km < 1 ? Math.round(km * 1000) + " m" : km.toFixed(1) + " km"; }

function showNearest(origin, originLabel){
  const ranked = stations
    .filter(s => s.lat != null)
    .map(s => ({ ...s, km: distanceKm(origin, s) }))
    .sort((x, y) => x.km - y.km)
    .slice(0, 3);
  const ol = $("results");
  ol.innerHTML = "";
  ranked.forEach((s, i) => {
    const li = document.createElement("li");
    const dest = s.a ? encodeURIComponent(s.a.replace(/[((][^))]*[))]/g, "")) : s.lat + "," + s.lng;
    const route = "https://www.google.com/maps/dir/?api=1&origin=" + origin.lat + "," + origin.lng + "&destination=" + dest;
    const note = s.s && !/開店中/.test(s.s) ? `(${s.s})` : "";
    li.innerHTML = `<div class="rank">${i + 1}</div>
      <div class="name"></div>
      <div class="addr"></div>
      <div class="dist"><b>${formatKm(s.km)}</b><a target="_blank" rel="noopener">経路を見る</a></div>`;
    li.querySelector(".name").textContent = s.n + note;
    li.querySelector(".addr").textContent = s.a || "";
    li.querySelector("a").href = route;
    ol.appendChild(li);
  });
  $("origin").textContent = "検索地点:" + originLabel;
  const markers = drawResults(origin, originLabel, ranked) || [];
  [...ol.children].forEach((li, i) => {
    if (!markers[i]) return;
    li.classList.add("clickable");
    li.addEventListener("click", e => {
      if (e.target.closest("a")) return;
      map.setView(markers[i].getLatLng(), Math.max(map.getZoom(), 15));
      markers[i].openPopup();
      if (window.matchMedia("(max-width:820px)").matches) $("map").scrollIntoView({ behavior: "smooth" });
    });
  });
  setStatus("");
}

async function searchAddress(){
  const q = $("q").value.trim();
  if (!q){ setStatus("住所を入力してください。", true); return; }
  $("go").disabled = true;
  setStatus("住所を検索しています…");
  try {
    const g = await geocode(q);
    if (!g){ setStatus("その住所が見つかりませんでした。都道府県から入力するか、番地を省いて試してください。", true); return; }
    showNearest(g, g.label);
  } catch (e) {
    setStatus("住所検索に接続できませんでした。インターネット接続を確認してください。", true);
  } finally { $("go").disabled = false; }
}

function searchHere(){
  if (!navigator.geolocation){ setStatus("このブラウザでは現在地を取得できません。住所を入力してください。", true); return; }
  setStatus("現在地を取得しています…");
  navigator.geolocation.getCurrentPosition(
    p => showNearest({ lat: p.coords.latitude, lng: p.coords.longitude }, "現在地"),
    () => setStatus("現在地を取得できませんでした。位置情報の利用を許可するか、住所を入力してください。", true),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

$("go").addEventListener("click", searchAddress);
$("here").addEventListener("click", searchHere);
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing && !$("go").disabled) searchAddress(); });
initMap();
loadStations();
